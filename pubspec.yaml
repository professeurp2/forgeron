name: forgeron
description: "Forgerons CNC 5-Axis Controller"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Localisation des widgets Material/Cupertino (dates, RTL arabe).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  http: ^1.6.0
  file_picker: 8.1.7
  # Capture photo (caméra) + galerie pour l'agent IA multimodal.
  image_picker: ^1.1.2
  # Audio de l'agent IA : dictée (STT) et lecture des réponses (TTS).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Notifications système (barre Android) quand l'agent IA a une info/problème.
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  vector_math: ^2.1.4
  # Visualiseur 3D : WebView natif par plateforme.
  #  - Windows  → webview_windows
  #  - Android/iOS → webview_flutter
  #  - Web      → iframe (aucun paquet)
  webview_windows: ^0.4.0
  webview_flutter: ^4.10.0
  audioplayers: ^6.6.0
  # Stockage sécurisé de la clé API de l'agent IA (Keychain/Keystore/DPAPI).
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  # Même mire partout : le "F" isolé (assets/icon/adaptive_foreground.png) sur
  # le fond sombre de la marque (#14181F). L'icône legacy/web/Windows utilisait
  # jusqu'ici le badge complet (assets/logo.png), dont le bandeau "FORGERON /
  # PRECISION CNC" se retrouvait tronqué une fois réduit à la taille d'un
  # launcher icon — d'où assets/icon/icon_square.png, ce même fond + "F" déjà
  # composés à plat, pour que toutes les plateformes soient logo-cohérentes.
  android: true
  min_sdk_android: 21
  image_path: "assets/icon/icon_square.png"
  adaptive_icon_background: "#14181F"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  ios: false
  web:
    generate: true
    image_path: "assets/icon/icon_square.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_square.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - web/three_viewer.html
    - web/js/three.min.js
    - web/js/OrbitControls.js
    - assets/logo.png
    - assets/images/tools/
    - assets/audio/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Police monospace utilisée ~150 fois (DRO, consoles G-code, badges).
  # Sans cette déclaration, Flutter retombait en silence sur la police système
  # (Roboto sur Android) : l'app n'avait pas le bon rendu dans l'APK.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani/Rajdhani-Bold.ttf
          weight: 700
