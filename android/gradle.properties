# NOTE: .properties files are read as ISO-8859-1 -> keep this file ASCII-only.
#
# Was: -Xmx8G -XX:MaxMetaspaceSize=4G
# That heap cannot be reserved on a 16 GB machine: the Gradle daemon dies at
# startup and Gradle reports the misleading
#   "java.io.IOException: Unable to establish loopback connection".
# 2 GB is plenty for this project.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
