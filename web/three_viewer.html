<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgeron 3D Digital Twin & Simulator</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #1c212b 0%, #0d1017 100%);
            color: #FF6B35;
            font-family: 'JetBrains Mono', Consolas, monospace;
        }
        body.light-studio {
            background: radial-gradient(circle at 50% 30%, #f8fafd 0%, #dfe5ef 100%);
            color: #1f2937;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        #hud-top-left {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 900;
        }
        #debug {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(13, 16, 23, 0.72);
            border: 1px solid rgba(255, 107, 53, 0.35);
            color: #ff6b35;
            backdrop-filter: blur(4px);
        }
        body.light-studio #debug {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(31, 41, 55, 0.2);
            color: #1f2937;
        }

        /* --- VIEWCUBE INDUSTRIEL (STYLE ACTERIS / CAD) --- */
        #viewcube-card {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 112px;
            padding: 8px 8px 6px 8px;
            border-radius: 10px;
            background: rgba(20, 24, 33, 0.82);
            border: 1px solid rgba(139, 147, 156, 0.28);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        }
        body.light-studio #viewcube-card {
            background: rgba(255, 255, 255, 0.90);
            border-color: rgba(15, 23, 42, 0.14);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
        }
        .vc-scene {
            width: 66px;
            height: 66px;
            perspective: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
        }
        .vc-cube {
            width: 44px;
            height: 44px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-25deg) rotateY(-38deg);
            transition: transform 0.08s linear;
        }
        .vc-face {
            position: absolute;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            border: 1px solid rgba(139, 147, 156, 0.55);
            background: rgba(42, 48, 60, 0.92);
            color: #e5e7eb;
            transition: background 0.15s, color 0.15s;
        }
        body.light-studio .vc-face {
            background: rgba(235, 239, 245, 0.95);
            border-color: rgba(100, 116, 139, 0.55);
            color: #1e293b;
        }
        .vc-face:hover {
            background: #ff6b35 !important;
            color: #ffffff !important;
        }
        .vc-front  { transform: rotateY(  0deg) translateZ(22px); }
        .vc-back   { transform: rotateY(180deg) translateZ(22px); }
        .vc-right  { transform: rotateY( 90deg) translateZ(22px); }
        .vc-left   { transform: rotateY(-90deg) translateZ(22px); }
        .vc-top    { transform: rotateX( 90deg) translateZ(22px); }
        .vc-bottom { transform: rotateX(-90deg) translateZ(22px); }

        #vc-label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.9px;
            color: #9aa3ab;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        body.light-studio #vc-label { color: #475569; }
        #vc-label:hover { color: #ff6b35; }

        .btn-container {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            z-index: 1000;
        }
        button {
            background: rgba(16, 20, 28, 0.78);
            border: 1px solid rgba(255, 107, 53, 0.55);
            color: #FF6B35;
            padding: 5px 9px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 9.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }
        body.light-studio button {
            background: rgba(255, 255, 255, 0.88);
            border-color: rgba(30, 41, 59, 0.25);
            color: #1e293b;
        }
        button:hover {
            background: rgba(255, 107, 53, 0.22);
            border-color: #FF6B35;
        }
        svg { width: 13px; height: 13px; }
    </style>
</head>
<body>
    <div id="hud-top-left">
        <div id="debug">JUMEAU NUMÉRIQUE 5 AXES · PRÊT</div>
    </div>

    <!-- ViewCube 3D Interactif (Style Acteris / CAO) -->
    <div id="viewcube-card" title="Cliquer une face pour orienter la caméra">
        <div class="vc-scene">
            <div class="vc-cube" id="vc-cube">
                <div class="vc-face vc-top" data-view="TOP">TOP</div>
                <div class="vc-face vc-bottom" data-view="BOTTOM">BOT</div>
                <div class="vc-face vc-front" data-view="FRONT">FRONT</div>
                <div class="vc-face vc-back" data-view="BACK">BACK</div>
                <div class="vc-face vc-right" data-view="RIGHT">RIGHT</div>
                <div class="vc-face vc-left" data-view="LEFT">LEFT</div>
            </div>
        </div>
        <div id="vc-label" data-view="ISOMETRIC">ISOMETRIC</div>
    </div>

    <div class="btn-container" id="floating-controls">
        <button id="reset-btn" title="Réinitialiser le brut et la vue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>Brut</span>
        </button>
        <button id="cabin-btn" title="Afficher/Masquer le carénage industriel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
            <span id="cabin-text">Cabine</span>
        </button>
        <button id="mode-btn" title="Afficher/Masquer la machine">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span id="mode-text">Machine</span>
        </button>
        <button id="fs-btn" title="Plein écran">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
    </div>

    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/dexel_stock.js"></script>
    <script>
        const debugEl = document.getElementById('debug');
        const debug = (msg) => { if (debugEl) debugEl.innerText = msg; };

        let needsRender = true;
        function requestRender() { needsRender = true; }

        // --- BRUT : matière tri-dexel (js/dexel_stock.js) et son maillage par morceaux ---
        const STOCK_RESOLUTION = /Android|iPhone|iPad/i.test(navigator.userAgent) ? 96 : 160;

        class DexelWorkpiece {
            constructor(parent, size, material, shape) {
                this.material = material;
                this.shape = shape;
                this.size = { x: size.x, y: size.y, z: size.z };
                this.mesh = new THREE.Group();
                parent.add(this.mesh);
                this.chunkMeshes = new Map();
                this._build();
            }

            _build() {
                for (const m of this.chunkMeshes.values()) {
                    this.mesh.remove(m);
                    m.geometry.dispose();
                }
                this.chunkMeshes.clear();
                const { x, y, z } = this.size;
                this.stock = new DexelStock({
                    shape: this.shape,
                    size: [x, y, z],
                    h: Math.max(x, y, z) / STOCK_RESOLUTION,
                });
                requestRender();
            }

            configure(shape, dims) {
                const nextShape = shape || this.shape;
                const sx = (dims && dims[0]) ? dims[0] : this.size.x;
                const sy = (dims && dims[1]) ? dims[1] : sx;
                const sz = (dims && dims[2]) ? dims[2] : this.size.z;
                const changed = nextShape !== this.shape || Math.abs(sx - this.size.x) > 0.01 ||
                    Math.abs(sy - this.size.y) > 0.01 || Math.abs(sz - this.size.z) > 0.01;
                this.shape = nextShape;
                this.size = { x: sx, y: sy, z: sz };
                if (changed) this._build(); else this.reset();
            }

            reset() {
                this.stock.reset();
                requestRender();
            }

            // Reconstruit les morceaux touchés, dans le temps accordé. Rend true s'il en reste.
            flush(budgetMs) {
                const end = performance.now() + budgetMs;
                const dirty = this.stock.dirty;
                for (const id of dirty) {
                    if (performance.now() > end) break;
                    dirty.delete(id);
                    const { positions, indices } = this.stock.extractChunk(id);
                    let m = this.chunkMeshes.get(id);
                    if (!indices.length) {
                        if (m) {
                            this.mesh.remove(m);
                            m.geometry.dispose();
                            this.chunkMeshes.delete(id);
                        }
                        continue;
                    }
                    if (!m) {
                        m = new THREE.Mesh(new THREE.BufferGeometry(), this.material);
                        m.castShadow = true;
                        this.chunkMeshes.set(id, m);
                        this.mesh.add(m);
                    }
                    m.geometry.dispose();
                    m.geometry = new THREE.BufferGeometry();
                    m.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    m.geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                    m.geometry.computeVertexNormals();
                    requestRender();
                }
                return dirty.size > 0;
            }

            getStats() {
                const initial = this.stock.initialVolume;
                const left = this.stock.volume();
                return {
                    shape: this.shape,
                    dimensionsMm: [this.size.x, this.size.y, this.size.z],
                    resolutionMm: this.stock.h,
                    initialVolumeMm3: initial,
                    remainingVolumeMm3: left,
                    removedPct: initial > 0 ? Math.round(((initial - left) / initial) * 1000) / 10 : 0,
                };
            }
        }

        // --- SCENE, CAMÉRA & ÉCLAIRAGE STUDIO CAO ---
        const scene = new THREE.Scene();
        const theme = {
            background: '#0e1117', surface: '#1b1e24', surfaceBright: '#d9dde1',
            surfaceBorder: '#8b939c', edge: '#000000', primary: '#ff6b35',
            success: '#3fb950', error: '#f85149', info: '#0080ff',
            textSecondary: '#9aa3ab',
        };
        const edgeMaterials = [];
        const cG0 = new THREE.Color(theme.error);
        const cG1 = new THREE.Color(theme.success);
        const cDone = new THREE.Color('#00d4ff');

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 6000);
        camera.position.set(340, -420, 310);
        camera.up.set(0, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0, 55);
        controls.addEventListener('change', () => {
            syncViewCube();
            requestRender();
        });

        // Éclairage Studio 3 Points
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.72);
        hemiLight.position.set(0, 0, 500);
        scene.add(hemiLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
        keyLight.position.set(220, -280, 380);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.42);
        fillLight.position.set(-250, 220, 200);
        scene.add(fillLight);

        // --- GRILLE MÉTRIQUE CAO AU SOL (Style Acteris) ---
        const floorGridGroup = new THREE.Group();
        const gridMinor = new THREE.GridHelper(900, 90, 0x475569, 0x1e293b);
        gridMinor.rotation.x = Math.PI / 2;
        gridMinor.position.z = -22;
        gridMinor.material.transparent = true;
        gridMinor.material.opacity = 0.35;
        floorGridGroup.add(gridMinor);

        const gridMajor = new THREE.GridHelper(900, 9, 0x64748b, 0x475569);
        gridMajor.rotation.x = Math.PI / 2;
        gridMajor.position.z = -21.8;
        gridMajor.material.transparent = true;
        gridMajor.material.opacity = 0.55;
        floorGridGroup.add(gridMajor);
        scene.add(floorGridGroup);

        // --- MATÉRIAUX INDUSTRIELS PBR ---
        const matCabinetLight = new THREE.MeshStandardMaterial({ color: 0xbfc6d0, metalness: 0.35, roughness: 0.55 });
        const matCabinetDark  = new THREE.MeshStandardMaterial({ color: 0x3b424d, metalness: 0.45, roughness: 0.50 });
        const matGlass        = new THREE.MeshStandardMaterial({ color: 0x93c5fd, metalness: 0.1, roughness: 0.15, transparent: true, opacity: 0.18, depthWrite: false });
        const matPlate        = new THREE.MeshStandardMaterial({ color: 0x252a34, metalness: 0.55, roughness: 0.45 });
        const matExtrusion    = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.78, roughness: 0.32 });
        const matMotor        = new THREE.MeshStandardMaterial({ color: 0x161920, metalness: 0.35, roughness: 0.70 });
        const matCap          = new THREE.MeshStandardMaterial({ color: 0xc88a55, metalness: 0.65, roughness: 0.42 });
        const matSteel        = new THREE.MeshStandardMaterial({ color: 0xd8dee6, metalness: 0.92, roughness: 0.18 });
        const matAccent       = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, metalness: 0.85, roughness: 0.35 });
        const matTool         = new THREE.MeshStandardMaterial({ color: 0xFF6B35, metalness: 0.88, roughness: 0.22 });
        const matTeal         = new THREE.MeshStandardMaterial({ color: 0x0f8b7d, metalness: 0.55, roughness: 0.38 });
        const matWorkpiece    = new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.25, roughness: 0.65 });
        const matLedRing      = new THREE.MeshBasicMaterial({ color: 0x3fb950 });

        function createMesh(geo, mat) {
            const m = new THREE.Mesh(geo, mat);
            const e = new THREE.EdgesGeometry(geo);
            const em = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.24 });
            edgeMaterials.push(em);
            m.add(new THREE.LineSegments(e, em));
            return m;
        }

        function createStepper(size, len, shaftLen) {
            const g = new THREE.Group();
            const body = createMesh(new THREE.BoxGeometry(size, size, len), matMotor); body.position.z = -len / 2;
            const cap = createMesh(new THREE.BoxGeometry(size * 0.9, size * 0.9, size * 0.16), matCap); cap.position.z = size * 0.08;
            const shaft = createMesh(new THREE.CylinderGeometry(size * 0.08, size * 0.08, shaftLen, 12), matSteel);
            shaft.rotation.x = Math.PI / 2; shaft.position.z = size * 0.16 + shaftLen / 2;
            g.add(body, cap, shaft);
            return g;
        }

        // --- MODÈLE JUMEAU NUMÉRIQUE 5 AXES + CELLULE INDUSTRIELLE ---
        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        // 1. Enceinte / Cabine industrielle CNC (Style Acteris)
        const enclosureGroup = new THREE.Group();
        machineGroup.add(enclosureGroup);

        // Socle d'atelier & bac à copeaux
        const basePedestal = createMesh(new THREE.BoxGeometry(280, 340, 18), matCabinetDark);
        basePedestal.position.set(15, -20, -13);
        enclosureGroup.add(basePedestal);

        // Paroi arrière et flancs de la cabine CNC
        const backWall = createMesh(new THREE.BoxGeometry(280, 14, 360), matCabinetLight);
        backWall.position.set(15, 165, 165);
        enclosureGroup.add(backWall);

        const leftWall = createMesh(new THREE.BoxGeometry(10, 320, 360), matCabinetLight);
        leftWall.position.set(-120, 10, 165);
        enclosureGroup.add(leftWall);

        // Pupitre opérateur latéral droit (Style Acteris)
        const controlCabinet = createMesh(new THREE.BoxGeometry(58, 320, 360), matCabinetLight);
        controlCabinet.position.set(126, 10, 165);
        enclosureGroup.add(controlCabinet);

        const hmiPanel = createMesh(new THREE.BoxGeometry(44, 6, 95), matCabinetDark);
        hmiPanel.position.set(126, -151, 225);
        enclosureGroup.add(hmiPanel);

        // Vitre polycarbonate de protection frontale (semi-transparente)
        const safetyWindow = new THREE.Mesh(new THREE.BoxGeometry(200, 4, 240), matGlass);
        safetyWindow.position.set(-10, -148, 175);
        enclosureGroup.add(safetyWindow);

        // 2. Bâti mécanique & Colonne Z
        const floor = createMesh(new THREE.BoxGeometry(140, 300, 22), matPlate);
        floor.position.set(0, -50, -11);
        machineGroup.add(floor);

        const col = createMesh(new THREE.BoxGeometry(130, 45, 350), matPlate);
        col.position.set(0, 138, 165);
        machineGroup.add(col);
        [-48, 48].forEach(x => {
            const p = createMesh(new THREE.BoxGeometry(22, 30, 340), matExtrusion);
            p.position.set(x, 108, 168);
            machineGroup.add(p);
        });

        // 3. Axe Z & Électrobroche avec anneau LED d'état
        const zRailGroup = new THREE.Group();
        zRailGroup.position.set(0, 40, 200);
        machineGroup.add(zRailGroup);
        const zPlate = createMesh(new THREE.BoxGeometry(60, 12, 210), matPlate);
        zPlate.position.set(0, 8, 0);
        zRailGroup.add(zPlate);
        const zStepper = createStepper(42, 42, 16);
        zStepper.rotation.x = Math.PI;
        zStepper.position.set(0, 1, 118);
        zRailGroup.add(zStepper);

        const zAxis = new THREE.Group();
        machineGroup.add(zAxis);
        const spindle = createMesh(new THREE.CylinderGeometry(20, 20, 90, 32), matMotor);
        spindle.rotation.x = Math.PI / 2;
        zAxis.add(spindle);

        // Anneau lumineux d'état (vert = prêt, orange = coupe, rouge = alarme)
        const spindleLed = new THREE.Mesh(new THREE.TorusGeometry(20.6, 1.8, 12, 32), matLedRing);
        spindleLed.position.set(0, 0, -40);
        zAxis.add(spindleLed);

        const chuck = createMesh(new THREE.CylinderGeometry(8, 10, 22, 20), matAccent);
        chuck.rotation.x = Math.PI / 2;
        chuck.position.set(0, 0, -56);
        zAxis.add(chuck);

        const toolBit = createMesh(new THREE.CylinderGeometry(3, 1.5, 22, 20), matTool);
        toolBit.rotation.x = Math.PI / 2;
        toolBit.position.set(0, 0, -80);
        zAxis.add(toolBit);

        // Halo au point de contact de coupe
        const cutSparkGeo = new THREE.SphereGeometry(2.8, 12, 12);
        const cutSparkMat = new THREE.MeshBasicMaterial({ color: 0xff9f1c, transparent: true, opacity: 0.85 });
        const cutSpark = new THREE.Mesh(cutSparkGeo, cutSparkMat);
        cutSpark.position.set(0, 0, -91);
        cutSpark.visible = false;
        zAxis.add(cutSpark);

        // 4. Chaîne cinématique Y -> X -> Berceau A -> Plateau C
        const yAxis = new THREE.Group();
        machineGroup.add(yAxis);
        const yTable = createMesh(new THREE.BoxGeometry(110, 170, 10), matPlate);
        yTable.position.z = 5;
        yAxis.add(yTable);
        const yMotor = createStepper(38, 38, 12);
        yMotor.rotation.x = -Math.PI / 2;
        yMotor.position.set(0, -128, -3);
        machineGroup.add(yMotor);

        const xAxis = new THREE.Group();
        xAxis.position.z = 10;
        yAxis.add(xAxis);
        const xTable = createMesh(new THREE.BoxGeometry(150, 90, 6), matPlate);
        xTable.position.z = 3;
        xAxis.add(xTable);
        const xMotor = createStepper(38, 38, 12);
        xMotor.rotation.y = Math.PI / 2;
        xMotor.position.set(-85, 0, 8);
        yAxis.add(xMotor);

        const trunnionBase = new THREE.Group();
        trunnionBase.position.z = 6;
        xAxis.add(trunnionBase);
        const tSuppL = createMesh(new THREE.BoxGeometry(14, 80, 62), matPlate);
        tSuppL.position.set(-62, 0, 31);
        trunnionBase.add(tSuppL);
        const tSuppR = createMesh(new THREE.BoxGeometry(14, 80, 62), matPlate);
        tSuppR.position.set(62, 0, 31);
        trunnionBase.add(tSuppR);
        const aMotor = createStepper(36, 36, 12);
        aMotor.rotation.y = -Math.PI / 2;
        aMotor.position.set(80, 0, 40);
        trunnionBase.add(aMotor);

        const aAxis = new THREE.Group();
        aAxis.position.set(0, 0, 40);
        trunnionBase.add(aAxis);
        const cradle = createMesh(new THREE.BoxGeometry(118, 46, 10), matPlate);
        cradle.position.z = -14;
        aAxis.add(cradle);
        const cMotor = createStepper(34, 34, 10);
        cMotor.position.z = -44;
        aAxis.add(cMotor);

        // Chargement optionnel du maillage CAO binaire A-axis.STL injecté en Base64
        const A_AXIS_STL_B64 = "__A_AXIS_STL_BASE64__";
        function loadEmbeddedAAxisStl(b64) {
            if (!b64 || b64.length < 120 || b64.startsWith("__A_AXIS")) return;
            try {
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const dv = new DataView(bytes.buffer);
                const numTris = dv.getUint32(80, true);
                if (84 + numTris * 50 > bytes.byteLength || numTris === 0 || numTris > 250000) return;

                const positions = new Float32Array(numTris * 9);
                let offset = 84;
                let k = 0;
                for (let t = 0; t < numTris; t++) {
                    offset += 12; // normale
                    for (let v = 0; v < 3; v++) {
                        positions[k++] = dv.getFloat32(offset, true);
                        positions[k++] = dv.getFloat32(offset + 4, true);
                        positions[k++] = dv.getFloat32(offset + 8, true);
                        offset += 12;
                    }
                    offset += 2; // attribute byte count
                }
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.computeVertexNormals();
                geo.computeBoundingBox();
                const bb = geo.boundingBox;
                const size = new THREE.Vector3();
                bb.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const center = new THREE.Vector3();
                    bb.getCenter(center);
                    geo.translate(-center.x, -center.y, -center.z);
                    const scale = 116 / maxDim;
                    geo.scale(scale, scale, scale);
                }
                const stlMesh = new THREE.Mesh(geo, matExtrusion);
                stlMesh.position.set(0, 0, -12);
                cradle.visible = false;
                aAxis.add(stlMesh);
                requestRender();
            } catch (_) {}
        }
        loadEmbeddedAAxisStl(A_AXIS_STL_B64);

        const cAxis = new THREE.Group();
        cAxis.position.z = -8;
        aAxis.add(cAxis);
        const platter = createMesh(new THREE.CylinderGeometry(42, 42, 8, 48), matTeal);
        platter.rotation.x = Math.PI / 2;
        cAxis.add(platter);

        // --- BRUT VOXELISÉ & INTERPOLATION CINÉMATIQUE ---
        const workpiece = new DexelWorkpiece(cAxis, { x: 40, y: 40, z: 25 }, matWorkpiece, 'cylinder');

        // --- ZÉRO PIÈCE ---
        // Même chaîne que pipeline/kinematics.py : G54 sur le dessus du brut et sur
        // l'axe C à A=C=0, pivot A à D sous ce zéro. Sans pivot déclaré par le
        // programme : D = hauteur du brut + distance pivot-plateau mesurée.
        const PIVOT_TO_TABLE_MM = 8;
        const TOOL_TIP_BELOW_ZAXIS = 91;   // pointe du foret, dans le repère de zAxis
        const PIVOT_Z_IN_SCENE = 10 + 6 + 40; // xAxis + trunnionBase + aAxis
        let declaredPivotDepth = null;

        function stockHeight() { return workpiece.size.z; }
        function pivotDepth() {
            return declaredPivotDepth != null ? declaredPivotDepth : stockHeight() + PIVOT_TO_TABLE_MM;
        }
        function placeStock() { cAxis.position.z = pivotDepth() - stockHeight(); }
        placeStock();

        const currentMachine = { x: 0, y: 0, z: 0, a: 0, c: 0 };
        const targetMachine  = { x: 0, y: 0, z: 0, a: 0, c: 0 };
        let activeToolpathIndex = 0;
        let currentToolRadius = 3.0;

        function toolTipWorld() {
            zAxis.updateWorldMatrix(true, false);
            return zAxis.localToWorld(new THREE.Vector3(0, 0, -TOOL_TIP_BELOW_ZAXIS));
        }

        // Pointe d'outil dans le repère pièce, lue sur le graphe de scène : c'est ce
        // que les tests comparent au rejeu du pipeline.
        window.forgeronTipInPiece = () => {
            workpiece.mesh.updateWorldMatrix(true, false);
            const p = workpiece.mesh.worldToLocal(toolTipWorld());
            return [p.x, p.y, p.z - stockHeight()];
        };

        // --- COUPE ---
        // Chaque bloc franchi depuis le dernier passage est coupé en entier : même à
        // vitesse ×100, aucune passe n'est sautée. Le calcul avance par tranches de
        // temps à chaque image, l'écran reste fluide et la file se rattrape.
        const cutQueue = [];
        let lastCutIndex = 0;
        let cutCursor = null;       // dernière position coupée : x, y, z pièce, a, c
        let currentToolType = 'ball';

        function resetCut() {
            cutQueue.length = 0;
            lastCutIndex = 0;
            cutCursor = null;
        }

        function pathPoint(i) {
            const flat = Array.isArray(lastToolpath[0]);
            const at = (k) => flat ? lastToolpath[i][k] : lastToolpath[i * 6 + k];
            return [at(0), at(1), at(2), at(3) || 0, at(4) || 0];
        }

        function pathLength() {
            if (!lastToolpath) return 0;
            return Array.isArray(lastToolpath[0]) ? lastToolpath.length : Math.floor(lastToolpath.length / 6);
        }

        // Le parcours est en repère pièce si le programme déclare son pivot ou s'il
        // reste à A=C=0. Sinon on ne sait pas où est son zéro, et on ne coupe que
        // d'après la position simulée.
        function pathIsInPieceFrame() {
            if (declaredPivotDepth != null) return true;
            for (let i = 0; i < pathLength(); i++) {
                const p = pathPoint(i);
                if (p[3] !== 0 || p[4] !== 0) return false;
            }
            return true;
        }

        function queueCut(index, m, simulated) {
            if (index < lastCutIndex) {
                workpiece.reset();
                resetCut();
            }
            if (index <= 0) return;
            const n = pathLength();
            if (n > 0 && pathIsInPieceFrame()) {
                if (!cutCursor) cutCursor = pathPoint(Math.min(lastCutIndex, n - 1));
                for (let b = lastCutIndex + 1; b <= Math.min(index, n - 1); b++) {
                    const to = pathPoint(b);
                    cutQueue.push([cutCursor, to]);
                    cutCursor = to;
                }
                lastCutIndex = Math.max(lastCutIndex, index);
            }
            if (simulated) {
                const t = window.forgeronTipInPiece();
                const live = [t[0], t[1], t[2], m.a, m.c];
                if (cutCursor) cutQueue.push([cutCursor, live]);
                cutCursor = live;
            }
        }

        function toolAxisInPiece(aDeg, cDeg) {
            const a = aDeg * Math.PI / 180;
            const c = cDeg * Math.PI / 180;
            return [Math.sin(c) * Math.sin(a), Math.cos(c) * Math.sin(a), Math.cos(a)];
        }

        function runCut(from, to) {
            const H = stockHeight();
            const tool = { radius: currentToolRadius, type: currentToolType };
            // Quand l'axe tourne, on coupe par petites tranches à axe constant.
            const turn = Math.max(Math.abs(to[3] - from[3]), Math.abs(to[4] - from[4]));
            const steps = Math.max(1, Math.ceil(turn / 2));
            for (let i = 0; i < steps; i++) {
                const u0 = i / steps;
                const u1 = (i + 1) / steps;
                const mix = (k, u) => from[k] + (to[k] - from[k]) * u;
                workpiece.stock.sweep(
                    [mix(0, u0), mix(1, u0), mix(2, u0) + H],
                    [mix(0, u1), mix(1, u1), mix(2, u1) + H],
                    tool,
                    toolAxisInPiece(mix(3, (u0 + u1) / 2), mix(4, (u0 + u1) / 2)),
                );
            }
        }

        function stockTick() {
            const end = performance.now() + 8;
            while (cutQueue.length && performance.now() < end) {
                const [from, to] = cutQueue.shift();
                runCut(from, to);
            }
            workpiece.flush(5);
            if (cutQueue.length) requestRender();
        }

        // Pour les essais : tout traiter d'un coup, puis lire l'état du brut.
        window.forgeronFinishCut = () => {
            while (cutQueue.length) {
                const [from, to] = cutQueue.shift();
                runCut(from, to);
            }
            workpiece.flush(1e6);
            requestRender();
            return workpiece.getStats();
        };

        function applyMachineCoords(m, isCutting) {
            zAxis.position.z = PIVOT_Z_IN_SCENE + pivotDepth() + TOOL_TIP_BELOW_ZAXIS + m.z;
            xAxis.position.x = -m.x;
            yAxis.position.y = -m.y;
            aAxis.rotation.x = m.a * Math.PI / 180;
            cAxis.rotation.z = m.c * Math.PI / 180;

            if (isCutting) {
                matLedRing.color.setHex(0xff6b35);
                cutSpark.visible = true;
                toolBit.rotation.z += 0.45;
            } else {
                matLedRing.color.setHex(0x3fb950);
                cutSpark.visible = false;
            }
        }

        function updateMachineStatus(payload) {
            const m = payload.mPos || [0, 0, 0, 0, 0];
            const declared = payload.pivotDepth != null ? payload.pivotDepth : null;
            if (declared !== declaredPivotDepth) {
                declaredPivotDepth = declared;
                placeStock();
            }
            targetMachine.x = m[0] || 0;
            targetMachine.y = m[1] || 0;
            targetMachine.z = m[2] || 0;
            targetMachine.a = m[3] || 0;
            targetMachine.c = m[4] || 0;
            activeToolpathIndex = payload.activeIndex || 0;
            if (payload.toolType === 'ball' || payload.toolType === 'flat') {
                currentToolType = payload.toolType;
            }
            applyMachineCoords(targetMachine, activeToolpathIndex > 0);
            queueCut(activeToolpathIndex, targetMachine, payload.simulated === true);
            currentMachine.x = targetMachine.x;
            currentMachine.y = targetMachine.y;
            currentMachine.z = targetMachine.z;
            currentMachine.a = targetMachine.a;
            currentMachine.c = targetMachine.c;
            requestRender();
        }

        // --- CONTRÔLES BOUTONS & VIEWCUBE ---
        document.getElementById('reset-btn').onclick = () => {
            workpiece.reset();
            resetCut();
            setCameraPreset('ISOMETRIC');
        };
        document.getElementById('cabin-btn').onclick = () => {
            enclosureGroup.visible = !enclosureGroup.visible;
            requestRender();
        };
        document.getElementById('mode-btn').onclick = () => {
            const m = machineGroup.visible;
            machineGroup.visible = !m;
            document.getElementById('mode-text').innerText = m ? 'Outil' : 'Machine';
            requestRender();
        };

        // Orientation caméra par ViewCube (Style Acteris)
        let camTween = null;
        function setCameraPreset(preset) {
            const p = (preset || 'ISOMETRIC').toUpperCase();
            const target = controls.target.clone();
            const dist = Math.max(180, camera.position.distanceTo(target));
            const dest = new THREE.Vector3();

            switch (p) {
                case 'TOP':
                    dest.set(target.x, target.y - 0.01, target.z + dist);
                    break;
                case 'BOTTOM':
                    dest.set(target.x, target.y + 0.01, target.z - dist);
                    break;
                case 'FRONT':
                    dest.set(target.x, target.y - dist, target.z + 20);
                    break;
                case 'BACK':
                    dest.set(target.x, target.y + dist, target.z + 20);
                    break;
                case 'RIGHT':
                    dest.set(target.x + dist, target.y, target.z + 20);
                    break;
                case 'LEFT':
                    dest.set(target.x - dist, target.y, target.z + 20);
                    break;
                default: // ISOMETRIC
                    dest.set(target.x + dist * 0.56, target.y - dist * 0.68, target.z + dist * 0.48);
                    break;
            }
            const lbl = document.getElementById('vc-label');
            if (lbl) lbl.innerText = p;
            camTween = {
                startPos: camera.position.clone(),
                endPos: dest,
                startTime: performance.now(),
                duration: 240,
            };
            requestRender();
        }

        document.querySelectorAll('[data-view]').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                setCameraPreset(el.getAttribute('data-view'));
            });
        });

        function syncViewCube() {
            const cube = document.getElementById('vc-cube');
            if (!cube) return;
            const offset = camera.position.clone().sub(controls.target).normalize();
            const yaw = Math.atan2(offset.x, -offset.y) * (180 / Math.PI);
            const pitch = Math.asin(Math.max(-1, Math.min(1, offset.z))) * (180 / Math.PI);
            cube.style.transform = `rotateX(${-pitch.toFixed(1)}deg) rotateY(${-yaw.toFixed(1)}deg)`;
        }

        // --- PRÉVISUALISATION DU PARCOURS D'OUTIL (ZÉRO FUITE VRAM) ---
        const toolpathGroup = new THREE.Group();
        scene.add(toolpathGroup);
        const pathMaterial = new THREE.LineBasicMaterial({ vertexColors: true });
        let pathLines = null;
        let vectorLines = null;
        let showVectors = false;
        let lastToolpath = null;

        function clearToolpath() {
            if (pathLines) {
                toolpathGroup.remove(pathLines);
                if (pathLines.geometry) pathLines.geometry.dispose();
                pathLines = null;
            }
            if (vectorLines) {
                toolpathGroup.remove(vectorLines);
                if (vectorLines.geometry) vectorLines.geometry.dispose();
                vectorLines = null;
            }
            requestRender();
        }

        function loadToolpath(pointsData) {
            lastToolpath = pointsData;
            resetCut();
            clearToolpath();
            if (!pointsData || pointsData.length === 0) {
                debug('PARCOURS VIDE');
                return;
            }
            const flat = Array.isArray(pointsData[0]);
            const n = flat ? pointsData.length : Math.floor(pointsData.length / 6);
            if (n < 2) return;

            const segCount = n - 1;
            const positions = new Float32Array(segCount * 6);
            const colors = new Float32Array(segCount * 6);
            const vecPositions = [];

            const get = (i, k) => flat ? pointsData[i][k] : pointsData[i * 6 + k];

            for (let i = 0; i < segCount; i++) {
                const x0 = get(i, 0), y0 = get(i, 1), z0 = get(i, 2);
                const x1 = get(i + 1, 0), y1 = get(i + 1, 1), z1 = get(i + 1, 2);
                const type = get(i + 1, 5);
                const c = (type === 0) ? cG0 : cG1;

                const o = i * 6;
                positions[o]     = x0; positions[o + 1] = y0; positions[o + 2] = z0;
                positions[o + 3] = x1; positions[o + 4] = y1; positions[o + 5] = z1;
                colors[o]     = c.r; colors[o + 1] = c.g; colors[o + 2] = c.b;
                colors[o + 3] = c.r; colors[o + 4] = c.g; colors[o + 5] = c.b;

                if (i % 10 === 0) {
                    const aRad = (get(i, 3) || 0) * Math.PI / 180;
                    const len = 8;
                    vecPositions.push(
                        x0, y0, z0,
                        x0, y0 - len * Math.sin(aRad), z0 + len * Math.cos(aRad)
                    );
                }
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            pathLines = new THREE.LineSegments(geo, pathMaterial);
            toolpathGroup.add(pathLines);

            if (vecPositions.length > 0) {
                const vGeo = new THREE.BufferGeometry();
                vGeo.setAttribute('position', new THREE.Float32BufferAttribute(vecPositions, 3));
                const vMat = new THREE.LineBasicMaterial({ color: new THREE.Color(theme.info) });
                vectorLines = new THREE.LineSegments(vGeo, vMat);
                vectorLines.visible = showVectors;
                toolpathGroup.add(vectorLines);
            }
            debug('PARCOURS : ' + n + ' PTS');
            if (!machineGroup.visible) fitCameraTo(pathLines);
            requestRender();
        }

        let limitsBox = null;
        function setLimits(b) {
            if (limitsBox) {
                scene.remove(limitsBox);
                if (limitsBox.geometry) limitsBox.geometry.dispose();
                limitsBox = null;
            }
            if (!b) return;
            const sx = (b.maxX ?? 100) - (b.minX ?? -100);
            const sy = (b.maxY ?? 100) - (b.minY ?? -100);
            const sz = (b.maxZ ?? 100) - (b.minZ ?? -100);
            const g = new THREE.BoxGeometry(sx, sy, sz);
            const e = new THREE.EdgesGeometry(g);
            g.dispose();
            limitsBox = new THREE.LineSegments(
                e,
                new THREE.LineBasicMaterial({ color: new THREE.Color(theme.primary), transparent: true, opacity: 0.35 })
            );
            limitsBox.position.set(
                ((b.maxX ?? 100) + (b.minX ?? -100)) / 2,
                ((b.maxY ?? 100) + (b.minY ?? -100)) / 2,
                ((b.maxZ ?? 100) + (b.minZ ?? -100)) / 2
            );
            scene.add(limitsBox);
            requestRender();
        }

        // --- MAILLAGE DE PIÈCE (STEP facettisé) ---
        const partGroup = new THREE.Group();
        scene.add(partGroup);
        const matPart = new THREE.MeshStandardMaterial({
            color: 0xd9dde1,
            metalness: 0.35,
            roughness: 0.45,
            side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1,
        });
        let partMesh = null;

        function clearMesh() {
            if (!partMesh) return;
            partGroup.remove(partMesh);
            partMesh.geometry.dispose();
            partMesh = null;
            requestRender();
        }

        function loadMesh(data) {
            clearMesh();
            if (!data || !data.vertices || data.vertices.length < 9) {
                debug('MAILLAGE VIDE');
                return;
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(data.vertices, 3));
            if (data.indices && data.indices.length >= 3) {
                geo.setIndex(data.indices);
            }
            geo.computeVertexNormals();
            partMesh = new THREE.Mesh(geo, matPart);
            partGroup.add(partMesh);

            const nTri = data.indices ? (data.indices.length / 3) : (data.vertices.length / 9);
            debug('PIÈCE CAO : ' + nTri + ' TRIANGLES');
            fitCameraTo(partMesh);
            requestRender();
        }

        function fitCameraTo(obj) {
            obj.geometry.computeBoundingBox();
            const bb = obj.geometry.boundingBox;
            const center = new THREE.Vector3();
            const size = new THREE.Vector3();
            bb.getCenter(center);
            bb.getSize(size);
            const span = Math.max(size.x, size.y, size.z, 20);
            controls.target.copy(center);
            camera.position.set(center.x + span * 1.4, center.y - span * 1.8, center.z + span * 1.2);
            controls.update();
            syncViewCube();
            requestRender();
        }

        function applyScene(s) {
            if (!s) return;
            if (typeof s.machine === 'boolean') {
                machineGroup.visible = s.machine;
                floorGridGroup.visible = s.machine;
            }
            if (typeof s.toolpath === 'boolean') toolpathGroup.visible = s.toolpath;
            if (typeof s.part === 'boolean') partGroup.visible = s.part;
            if (typeof s.workpiece === 'boolean' && workpiece.mesh) {
                workpiece.mesh.visible = s.workpiece;
            }
            if (typeof s.controls === 'boolean') {
                document.getElementById('floating-controls').style.display = s.controls ? 'flex' : 'none';
            }
            requestRender();
        }

        function applyTheme(p) {
            if (!p) return;
            Object.assign(theme, p);
            const isLight = p.background && (p.background.toLowerCase().startsWith('#f') || p.background.toLowerCase().startsWith('#e'));
            document.body.classList.toggle('light-studio', !!isLight);

            matPlate.color.set(isLight ? '#334155' : theme.surface);
            matExtrusion.color.set(theme.surfaceBorder);
            matAccent.color.set(theme.textSecondary);
            matTool.color.set(theme.primary);
            matPart.color.set(theme.surfaceBright);

            const edgeColor = new THREE.Color(theme.edge);
            for (const m of edgeMaterials) m.color.copy(edgeColor);

            cG0.set(theme.error);
            cG1.set(theme.success);
            requestRender();
        }

        function postHostMessage(obj) {
            const msg = JSON.stringify(obj);
            if (window.ForgeronChannel) window.ForgeronChannel.postMessage(msg);
            if (window.ForgeronBridge) window.ForgeronBridge.postMessage(msg);
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
            if (window.parent && window.parent !== window) {
                try { window.parent.postMessage(obj, '*'); } catch (_) {}
            }
        }

        function captureSnapshot(opts) {
            opts = opts || {};
            const requestId = opts.requestId || ('snap_' + Date.now());
            const tempScene = (opts.temporaryScene && typeof opts.temporaryScene === 'object')
                ? opts.temporaryScene
                : null;

            const savedVis = tempScene ? {
                machine: machineGroup.visible,
                floor: floorGridGroup.visible,
                toolpath: toolpathGroup.visible,
                part: partGroup.visible,
                workpiece: workpiece.mesh ? workpiece.mesh.visible : false,
                enclosure: enclosureGroup.visible,
                camPos: camera.position.clone(),
                target: controls.target.clone(),
                vcLabel: (document.getElementById('vc-label') && document.getElementById('vc-label').innerText) || 'ISOMETRIC',
            } : null;

            try {
                if (tempScene) {
                    applyScene(tempScene);
                    if (!machineGroup.visible && partGroup.visible && partMesh) {
                        fitCameraTo(partMesh);
                    } else if (!machineGroup.visible && toolpathGroup.visible && pathLines) {
                        fitCameraTo(pathLines);
                    }
                }

                if (opts.cameraPreset) {
                    setCameraPreset(opts.cameraPreset);
                }
                if (camTween) {
                    camera.position.copy(camTween.endPos);
                    camTween = null;
                    controls.update();
                    syncViewCube();
                }

                renderer.render(scene, camera);
                needsRender = false;

                const srcW = Math.max(1, renderer.domElement.width);
                const srcH = Math.max(1, renderer.domElement.height);
                const scale = Math.min(1, 1024 / Math.max(srcW, srcH));
                const outW = Math.max(64, Math.round(srcW * scale));
                const outH = Math.max(64, Math.round(srcH * scale));

                const off = document.createElement('canvas');
                off.width = outW;
                off.height = outH;
                const ctx = off.getContext('2d');

                const isLight = document.body.classList.contains('light-studio');
                const grad = ctx.createLinearGradient(0, 0, 0, outH);
                if (isLight) {
                    grad.addColorStop(0, '#f8fafc');
                    grad.addColorStop(1, '#e2e8f0');
                } else {
                    grad.addColorStop(0, '#1e2533');
                    grad.addColorStop(1, '#0e1117');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, outW, outH);
                ctx.drawImage(renderer.domElement, 0, 0, outW, outH);

                const stock = workpiece.getStats();
                const tpPts = lastToolpath
                    ? (Array.isArray(lastToolpath[0]) ? lastToolpath.length : Math.floor(lastToolpath.length / 6))
                    : 0;
                const camLabel = (document.getElementById('vc-label') && document.getElementById('vc-label').innerText) || 'ISOMETRIC';
                const hudText = opts.hudBanner || (
                    `VUE ${camLabel} | X:${currentMachine.x.toFixed(1)} Y:${currentMachine.y.toFixed(1)} Z:${currentMachine.z.toFixed(1)} A:${currentMachine.a.toFixed(1)}° C:${currentMachine.c.toFixed(1)}°` +
                    (tpPts > 0 ? ` | PARCOURS:${tpPts} pts` : '') +
                    ((workpiece.mesh && workpiece.mesh.visible) ? ` | BRUT COUPÉ:${stock.removedPct}%` : '')
                );

                ctx.font = 'bold 12px monospace';
                const textW = Math.min(outW - 24, ctx.measureText(hudText).width + 20);
                ctx.fillStyle = isLight ? 'rgba(15, 23, 42, 0.78)' : 'rgba(14, 17, 23, 0.82)';
                ctx.fillRect(10, 10, textW, 24);
                ctx.strokeStyle = theme.primary || '#ff6b35';
                ctx.lineWidth = 1;
                ctx.strokeRect(10, 10, textW, 24);
                ctx.fillStyle = '#f8fafc';
                ctx.fillText(hudText, 20, 26, outW - 44);

                const metrics = {
                    stock,
                    machinePos: { ...currentMachine },
                    activeToolpathIndex,
                    toolDiameterMm: Math.round(currentToolRadius * 200) / 100,
                    toolpathPoints: tpPts,
                    hasPartMesh: !!partMesh,
                    visibleLayers: {
                        machine: machineGroup.visible,
                        enclosure: enclosureGroup.visible,
                        toolpath: toolpathGroup.visible,
                        part: partGroup.visible,
                        workpiece: !!(workpiece.mesh && workpiece.mesh.visible),
                    },
                    cameraPreset: camLabel,
                    hudBanner: hudText,
                };

                const dataUrl = off.toDataURL('image/png');
                postHostMessage({
                    type: 'snapshot_result',
                    requestId,
                    dataUrl,
                    width: outW,
                    height: outH,
                    metrics,
                });
            } catch (err) {
                postHostMessage({
                    type: 'snapshot_result',
                    requestId,
                    error: String(err),
                });
            } finally {
                if (savedVis) {
                    machineGroup.visible = savedVis.machine;
                    floorGridGroup.visible = savedVis.floor;
                    toolpathGroup.visible = savedVis.toolpath;
                    partGroup.visible = savedVis.part;
                    if (workpiece.mesh) workpiece.mesh.visible = savedVis.workpiece;
                    enclosureGroup.visible = savedVis.enclosure;
                    camera.position.copy(savedVis.camPos);
                    controls.target.copy(savedVis.target);
                    const lbl = document.getElementById('vc-label');
                    if (lbl) lbl.innerText = savedVis.vcLabel;
                    controls.update();
                    syncViewCube();
                    requestRender();
                }
            }
        }

        document.getElementById('fs-btn').onclick = () => {
            postHostMessage({ type: 'toggle_fullscreen' });
        };

        window.handleMessage = window.handleFlutterMessage = (rawData) => {
            const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
            const payload = data.payload !== undefined ? data.payload : (data.data !== undefined ? data.data : data);
            switch (data.type || data.action) {
                case 'update_machine':
                case 'update':
                    updateMachineStatus(payload);
                    break;
                case 'load_toolpath':
                    loadToolpath(Array.isArray(payload) ? payload : (payload && payload.points));
                    break;
                case 'clear_toolpath':
                    clearToolpath();
                    break;
                case 'load_mesh':
                    loadMesh(payload && payload.vertices ? payload : data.mesh);
                    break;
                case 'clear_mesh':
                    clearMesh();
                    break;
                case 'set_scene':
                    applyScene(payload);
                    break;
                case 'set_theme':
                    applyTheme(payload);
                    break;
                case 'set_limits':
                    if (payload && payload.x !== undefined) {
                        setLimits({
                            minX: -payload.x / 2, maxX: payload.x / 2,
                            minY: -payload.y / 2, maxY: payload.y / 2,
                            minZ: 0, maxZ: payload.z,
                        });
                    } else {
                        setLimits(payload);
                    }
                    break;
                case 'toggle_vectors':
                case 'set_vectors':
                    showVectors = typeof payload === 'boolean' ? payload : !!(payload && payload.show);
                    if (vectorLines) vectorLines.visible = showVectors;
                    requestRender();
                    break;
                case 'set_camera_preset':
                    setCameraPreset(typeof payload === 'string' ? payload : (payload && payload.preset));
                    break;
                case 'configure_stock':
                    workpiece.configure(payload && payload.shape, payload && payload.dimensions);
                    resetCut();
                    placeStock();
                    if (payload && typeof payload.toolDiameter === 'number' && payload.toolDiameter > 0) {
                        currentToolRadius = payload.toolDiameter / 2.0;
                    }
                    break;
                case 'reset_stock':
                    workpiece.reset();
                    resetCut();
                    break;
                case 'set_enclosure':
                    enclosureGroup.visible = typeof payload === 'boolean' ? payload : !!(payload && payload.show);
                    requestRender();
                    break;
                case 'capture_snapshot':
                    captureSnapshot(payload);
                    break;
                case 'reset_camera':
                    if (partGroup.visible && partMesh) {
                        fitCameraTo(partMesh);
                    } else if (!machineGroup.visible && pathLines) {
                        fitCameraTo(pathLines);
                    } else {
                        controls.target.set(0, 0, 55);
                        setCameraPreset('ISOMETRIC');
                    }
                    break;
            }
        };

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', e => window.handleMessage(e.data));
        }

        function animate(now) {
            requestAnimationFrame(animate);

            if (camTween) {
                const elapsed = now - camTween.startTime;
                const t = Math.min(1, elapsed / camTween.duration);
                const ease = 1 - Math.pow(1 - t, 3);
                camera.position.lerpVectors(camTween.startPos, camTween.endPos, ease);
                controls.update();
                syncViewCube();
                needsRender = true;
                if (t >= 1) camTween = null;
            } else if (controls.enableDamping) {
                if (controls.update()) {
                    syncViewCube();
                    needsRender = true;
                }
            }

            stockTick();

            if (needsRender) {
                renderer.render(scene, camera);
                needsRender = false;
            }
        }
        syncViewCube();
        requestAnimationFrame(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            requestRender();
        });

        function announceReady() {
            const readyMsg = JSON.stringify({ type: 'viewer_ready' });
            if (window.ForgeronChannel) window.ForgeronChannel.postMessage(readyMsg);
            if (window.ForgeronBridge) window.ForgeronBridge.postMessage(readyMsg);
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(readyMsg);
        }
        announceReady();
        setTimeout(announceReady, 150);
        setTimeout(announceReady, 500);
    </script>
</body>
</html>
