<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgeron 3D Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #58a6ff; font-family: monospace; }
        canvas { display: block; }
        #debug { position: absolute; top: 10; left: 10; font-size: 10px; pointer-events: none; }
        #fs-btn { 
            position: absolute; bottom: 20px; right: 20px; 
            background: rgba(0,0,0,0.5); border: 1px solid #58a6ff; color: #58a6ff; 
            padding: 8px 12px; cursor: pointer; border-radius: 4px; font-size: 12px;
            display: flex; align-items: center; gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1000;
        }
        #fs-btn:hover { background: rgba(88, 166, 255, 0.2); }
    </style>
</head>
<body>
    <div id="debug">ENGINE: INITIALIZING...</div>
    <button id="fs-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        PLEIN ÉCRAN
    </button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const debug = (msg) => { document.getElementById('debug').innerText = msg; console.log(msg); };
        
        if (typeof THREE === 'undefined') {
            debug("ERROR: THREE.JS NOT LOADED (CHECK INTERNET)");
        } else {
            debug("ENGINE: THREE.JS LOADED. STARTING SCENE...");
        }

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#050505');
        
        // Grid & Axes
        const gridHelper = new THREE.GridHelper(500, 50, '#30363d', '#21262d');
        gridHelper.rotation.x = Math.PI / 2; // Orient grid for CNC (Z is up)
        scene.add(gridHelper);
        const axesHelper = new THREE.AxesHelper(50);
        scene.add(axesHelper);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.set(200, -200, 200);
        camera.up.set(0, 0, 1); // Z is UP in CNC

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 100, 200);
        scene.add(dirLight);

        // --- SHADERS & MATERIALS ---
        // We use LineBasicMaterial with vertexColors for the toolpath
        const pathMaterial = new THREE.LineBasicMaterial({
            vertexColors: true,
            linewidth: 1 // Note: WebGL standard restricts linewidth to 1 on most platforms
        });

        let pathLines = null;
        let vectorLines = null;
        let showVectors = false;

        // --- GHOST & MACHINE MODEL ---
        const ghostMaterial = new THREE.MeshPhongMaterial({ color: 0x58a6ff, wireframe: true, transparent: true, opacity: 0.8 });
        const ghostMesh = new THREE.Mesh(new THREE.ConeGeometry(5, 20, 16), ghostMaterial);
        // Pivot cone so tip is at bottom
        ghostMesh.geometry.translate(0, 10, 0); 
        ghostMesh.geometry.rotateX(Math.PI / 2); // Point along Z
        scene.add(ghostMesh);

        // --- HIGHLIGHT CURRENT SEGMENT ---
        // (Handled via updating a small secondary line geometry for performance)
        const highlightMaterial = new THREE.LineBasicMaterial({ color: 0xffea00, linewidth: 3 });
        const highlightGeo = new THREE.BufferGeometry();
        highlightGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
        const highlightLine = new THREE.Line(highlightGeo, highlightMaterial);
        scene.add(highlightLine);

        // --- DATA STATE ---
        let toolpathData = []; // Store raw data for highlight lookups

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- FULLSCREEN HANDLER ---
        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fs-btn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg> QUITTER';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fs-btn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg> PLEIN ÉCRAN';
                }
            }
        });

        // --- MESSAGE HANDLER ---
        const handleMessage = (data) => {
            if (data.type === 'load_toolpath') {
                loadToolpath(data.payload);
            } else if (data.type === 'update_machine') {
                updateMachine(data.payload);
            } else if (data.type === 'toggle_vectors') {
                showVectors = data.payload;
                if (vectorLines) vectorLines.visible = showVectors;
            }
        };

        window.addEventListener('message', (event) => {
            handleMessage(event.data);
        });

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
                handleMessage(event.data);
            });
        }

        function loadToolpath(pointsArray) {
            // pointsArray is flat: [x,y,z,a,c,type, x,y,z,a,c,type, ...]
            // Support both flat Float32List (Web) and Array of Arrays (Windows JSON)
            let flatData = pointsArray;
            if (Array.isArray(pointsArray) && Array.isArray(pointsArray[0])) {
                flatData = new Float32Array(pointsArray.length * 6);
                for (let i = 0; i < pointsArray.length; i++) {
                    for (let j = 0; j < 6; j++) {
                        flatData[i * 6 + j] = pointsArray[i][j];
                    }
                }
            }

            if (pathLines) scene.remove(pathLines);
            if (vectorLines) scene.remove(vectorLines);
            
            toolpathData = flatData;
            const numPoints = flatData.length / 6;
            
            const positions = new Float32Array(numPoints * 3);
            const colors = new Float32Array(numPoints * 3);
            
            // Vectors: 2 points per vector (start, end)
            const vecPositions = [];
            const vecColors = [];

            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            let minZ = Infinity, maxZ = -Infinity;

            const colorG0 = new THREE.Color('#f85149'); // Red
            const colorG1 = new THREE.Color('#3fb950'); // Green

            for (let i = 0; i < numPoints; i++) {
                const idx = i * 6;
                const x = flatData[idx];
                const y = flatData[idx + 1];
                const z = flatData[idx + 2];
                const a = flatData[idx + 3] || 0;
                const c = flatData[idx + 4] || 0;
                const type = flatData[idx + 5];

                // Bounding box
                if(x < minX) minX = x; if(x > maxX) maxX = x;
                if(y < minY) minY = y; if(y > maxY) maxY = y;
                if(z < minZ) minZ = z; if(z > maxZ) maxZ = z;

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                const color = (type === 0.0) ? colorG0 : colorG1;
                colors[i*3] = color.r;
                colors[i*3+1] = color.g;
                colors[i*3+2] = color.b;

                // Tool Vectors (only if A or C is non-zero, or every Nth point to save memory)
                if (i % 5 === 0) { // Sparsify vectors
                    const vecLength = 15;
                    // Calculate vector orientation: spindle is 0,0,1 in machine.
                    // Relative to part, spindle tilts by -C then -A.
                    // Assuming A is rotation around X, C is rotation around Z.
                    const radA = -a * Math.PI / 180;
                    const radC = -c * Math.PI / 180;
                    
                    const dir = new THREE.Vector3(0, 0, 1);
                    dir.applyAxisAngle(new THREE.Vector3(1,0,0), radA);
                    dir.applyAxisAngle(new THREE.Vector3(0,0,1), radC);
                    
                    vecPositions.push(x, y, z);
                    vecPositions.push(x + dir.x * vecLength, y + dir.y * vecLength, z + dir.z * vecLength);
                    vecColors.push(0, 0.5, 1,   0, 0.5, 1); // Blue vectors
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            pathLines = new THREE.Line(geometry, pathMaterial);
            scene.add(pathLines);

            // Vector lines
            if (vecPositions.length > 0) {
                const vecGeo = new THREE.BufferGeometry();
                vecGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vecPositions), 3));
                vecGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(vecColors), 3));
                const vecMat = new THREE.LineBasicMaterial({ vertexColors: true, opacity: 0.5, transparent: true });
                vectorLines = new THREE.LineSegments(vecGeo, vecMat);
                vectorLines.visible = showVectors;
                scene.add(vectorLines);
            }

            // Center camera
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            const cz = (minZ + maxZ) / 2;
            controls.target.set(cx, cy, cz);
            camera.position.set(cx + 100, cy - 150, cz + 100);
            controls.update();
        }

        function updateMachine(payload) {
            // payload: { mPos: [x,y,z,a,c], activeIndex: int }
            const mPos = payload.mPos;
            const idx = payload.activeIndex;

            // Ghost Tool Position
            // Assuming mPos represents the tool tip in WCS coordinates
            ghostMesh.position.set(mPos[0], mPos[1], mPos[2]);

            // Ghost Tool Orientation (A & C axes)
            const radA = -mPos[3] * Math.PI / 180;
            const radC = -mPos[4] * Math.PI / 180;
            const euler = new THREE.Euler(radA, 0, radC, 'ZXY');
            ghostMesh.setRotationFromEuler(euler);

            // Highlight current path segment
            if (idx > 0 && toolpathData.length > idx * 6) {
                const pos = highlightGeo.attributes.position.array;
                const p1 = (idx - 1) * 6;
                const p2 = idx * 6;
                
                pos[0] = toolpathData[p1]; pos[1] = toolpathData[p1+1]; pos[2] = toolpathData[p1+2];
                pos[3] = toolpathData[p2]; pos[4] = toolpathData[p2+1]; pos[5] = toolpathData[p2+2];
                highlightGeo.attributes.position.needsUpdate = true;
            }
        }

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Send ready message
        const sendReady = () => {
            window.parent.postMessage({ type: 'viewer_ready' }, '*');
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'viewer_ready' }));
            }
        };
        sendReady();
    </script>
</body>
</html>
