<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgeron 3D Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #FF6B35; font-family: monospace; }
        canvas { display: block; }
        #debug { position: absolute; top: 10px; left: 10px; font-size: 10px; pointer-events: none; opacity: 0.7; }
        .btn-container {
            position: absolute; bottom: 15px; right: 15px;
            display: flex; gap: 8px;
            z-index: 1000;
        }
        button {
            background: rgba(0,0,0,0.6); border: 1px solid #FF6B35; color: #FF6B35;
            padding: 6px 10px; cursor: pointer; border-radius: 4px; font-size: 10px;
            display: flex; align-items: center; gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        button:hover { background: rgba(255, 107, 53, 0.2); }
        svg { width: 14px; height: 14px; }
    </style>
</head>
<body>
    <div id="debug">ENGINE: INITIALIZING...</div>
    <div class="btn-container">
        <button id="reset-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>Reset</span>
        </button>
        <button id="mode-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span id="mode-text">Parcours</span>
        </button>
        <button id="fs-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
    </div>

    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script>
        const debug = (msg) => { document.getElementById('debug').innerText = msg; };

        // --- VOXEL SYSTEM (S'intègre au design sans le casser) ---
        class VoxelWorkpiece {
            constructor(parent, size, res, material) {
                this.res = res;
                this.voxelSize = size.x / res;
                this.nx = Math.ceil(size.x / this.voxelSize);
                this.ny = Math.ceil(size.y / this.voxelSize);
                this.nz = Math.ceil(size.z / this.voxelSize);
                this.count = this.nx * this.ny * this.nz;

                const geo = new THREE.BoxGeometry(this.voxelSize, this.voxelSize, this.voxelSize);
                this.mesh = new THREE.InstancedMesh(geo, material, this.count);
                this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                this.states = new Uint8Array(this.count).fill(1);
                this.dummy = new THREE.Object3D();
                this.matrix = new THREE.Matrix4();
                this.reset();
                parent.add(this.mesh);
            }
            reset() {
                let i = 0;
                const ox = -(this.nx * this.voxelSize)/2, oy = -(this.ny * this.voxelSize)/2;
                for(let x=0; x<this.nx; x++) for(let y=0; y<this.ny; y++) for(let z=0; z<this.nz; z++) {
                    this.dummy.position.set(ox+(x+0.5)*this.voxelSize, oy+(y+0.5)*this.voxelSize, (z+0.5)*this.voxelSize);
                    this.dummy.scale.set(1,1,1); this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, this.dummy.matrix); this.states[i] = 1; i++;
                }
                this.mesh.instanceMatrix.needsUpdate = true;
            }
            cut(worldToolPos, radius) {
                const local = this.mesh.worldToLocal(worldToolPos.clone());
                const rSq = radius * radius;
                const ox = -(this.nx * this.voxelSize)/2, oy = -(this.ny * this.voxelSize)/2;
                const iMinX = Math.max(0, Math.floor((local.x - radius - ox)/this.voxelSize));
                const iMaxX = Math.min(this.nx-1, Math.ceil((local.x + radius - ox)/this.voxelSize));
                const iMinY = Math.max(0, Math.floor((local.y - radius - oy)/this.voxelSize));
                const iMaxY = Math.min(this.ny-1, Math.ceil((local.y + radius - oy)/this.voxelSize));
                const iMinZ = Math.max(0, Math.floor((local.z - radius)/this.voxelSize));
                const iMaxZ = Math.min(this.nz-1, Math.ceil((local.z + radius)/this.voxelSize));
                let changed = false;
                for(let x=iMinX; x<=iMaxX; x++) for(let y=iMinY; y<=iMaxY; y++) for(let z=iMinZ; z<=iMaxZ; z++) {
                    const idx = x*(this.ny*this.nz) + y*this.nz + z;
                    if(this.states[idx] === 0) continue;
                    const dx = (ox+(x+0.5)*this.voxelSize) - local.x;
                    const dy = (oy+(y+0.5)*this.voxelSize) - local.y;
                    const dz = ((z+0.5)*this.voxelSize) - local.z;
                    if(dx*dx + dy*dy < rSq && Math.abs(dz) < radius) {
                        this.states[idx]=0; this.matrix.makeScale(0,0,0);
                        this.mesh.setMatrixAt(idx, this.matrix); changed = true;
                    }
                }
                if(changed) this.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        // --- SCENE & MATERIALS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#050505');
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.set(250, -350, 300); camera.up.set(0, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.target.set(0, 0, 50);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(100, -100, 200); scene.add(dirLight);

        const matPlate = new THREE.MeshStandardMaterial({ color: 0x1b1e24, metalness: 0.55, roughness: 0.5 });
        const matExtrusion = new THREE.MeshStandardMaterial({ color: 0x8b939c, metalness: 0.75, roughness: 0.35 });
        const matMotor = new THREE.MeshStandardMaterial({ color: 0x131313, metalness: 0.35, roughness: 0.75 });
        const matCap = new THREE.MeshStandardMaterial({ color: 0xbe8a5c, metalness: 0.65, roughness: 0.45 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xc2c8ce, metalness: 0.95, roughness: 0.18 });
        const matAccent = new THREE.MeshStandardMaterial({ color: 0x9aa3ab, metalness: 0.85, roughness: 0.35 });
        const matTool = new THREE.MeshStandardMaterial({ color: 0xFF6B35, metalness: 0.9, roughness: 0.2 });
        const matTeal = new THREE.MeshStandardMaterial({ color: 0x0f8b7d, metalness: 0.5, roughness: 0.4 });
        const matWorkpiece = new THREE.MeshStandardMaterial({ color: 0xd9dde1, metalness: 0.15, roughness: 0.85 });

        function createMesh(geo, mat) {
            const m = new THREE.Mesh(geo, mat);
            const e = new THREE.EdgesGeometry(geo);
            m.add(new THREE.LineSegments(e, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })));
            return m;
        }

        function createStepper(size, len, shaftLen) {
            const g = new THREE.Group();
            const body = createMesh(new THREE.BoxGeometry(size, size, len), matMotor); body.position.z = -len/2;
            const cap = createMesh(new THREE.BoxGeometry(size*0.9, size*0.9, size*0.16), matCap); cap.position.z = size*0.08;
            const shaft = createMesh(new THREE.CylinderGeometry(size*0.08, size*0.08, shaftLen, 12), matSteel);
            shaft.rotation.x = Math.PI/2; shaft.position.z = size*0.16 + shaftLen/2;
            g.add(body, cap, shaft); return g;
        }

        // --- MACHINE MODEL (RESTAURÉ) ---
        const machineGroup = new THREE.Group(); scene.add(machineGroup);

        // Base & Colonne
        const floor = createMesh(new THREE.BoxGeometry(120, 300, 22), matPlate); floor.position.set(0, -50, -11); machineGroup.add(floor);
        const col = createMesh(new THREE.BoxGeometry(130, 45, 350), matPlate); col.position.set(0, 145, 165); machineGroup.add(col);
        [-48, 48].forEach(x => {
            const p = createMesh(new THREE.BoxGeometry(22, 30, 340), matExtrusion); p.position.set(x, 112, 168); machineGroup.add(p);
        });

        // Z-Axis
        const zRailGroup = new THREE.Group(); zRailGroup.position.set(0, 40, 200); machineGroup.add(zRailGroup);
        const zPlate = createMesh(new THREE.BoxGeometry(60, 12, 210), matPlate); zPlate.position.set(0, 8, 0); zRailGroup.add(zPlate);
        const zStepper = createStepper(42, 42, 16); zStepper.rotation.x = Math.PI; zStepper.position.set(0, 1, 118); zRailGroup.add(zStepper);

        const zAxis = new THREE.Group(); machineGroup.add(zAxis);
        const spindle = createMesh(new THREE.CylinderGeometry(20, 20, 90, 32), matMotor); spindle.rotation.x = Math.PI/2; zAxis.add(spindle);
        const chuck = createMesh(new THREE.CylinderGeometry(8, 10, 22, 20), matAccent); chuck.rotation.x = Math.PI/2; chuck.position.set(0,0,-56); zAxis.add(chuck);
        const toolBit = createMesh(new THREE.CylinderGeometry(2, 0, 22, 16), matTool); toolBit.rotation.x = Math.PI/2; toolBit.position.set(0,0,-80); zAxis.add(toolBit);

        // Kinematics Y -> X -> A -> C
        const yAxis = new THREE.Group(); machineGroup.add(yAxis);
        const yTable = createMesh(new THREE.BoxGeometry(110, 170, 10), matPlate); yTable.position.z = 5; yAxis.add(yTable);
        const yMotor = createStepper(38, 38, 12); yMotor.rotation.x = -Math.PI/2; yMotor.position.set(0, -128, -3); machineGroup.add(yMotor);

        const xAxis = new THREE.Group(); xAxis.position.z = 10; yAxis.add(xAxis);
        const xTable = createMesh(new THREE.BoxGeometry(150, 90, 6), matPlate); xTable.position.z = 3; xAxis.add(xTable);
        const xMotor = createStepper(38, 38, 12); xMotor.rotation.y = Math.PI/2; xMotor.position.set(-85, 0, 8); yAxis.add(xMotor);

        const trunnionBase = new THREE.Group(); trunnionBase.position.z = 6; xAxis.add(trunnionBase);
        const tSuppL = createMesh(new THREE.BoxGeometry(14, 80, 62), matPlate); tSuppL.position.set(-62, 0, 31); trunnionBase.add(tSuppL);
        const tSuppR = createMesh(new THREE.BoxGeometry(14, 80, 62), matPlate); tSuppR.position.set(62, 0, 31); trunnionBase.add(tSuppR);
        const aMotor = createStepper(36, 36, 12); aMotor.rotation.y = -Math.PI/2; aMotor.position.set(80, 0, 40); trunnionBase.add(aMotor);

        const aAxis = new THREE.Group(); aAxis.position.set(0, 0, 40); trunnionBase.add(aAxis);
        const cradle = createMesh(new THREE.BoxGeometry(118, 46, 10), matPlate); cradle.position.z = -14; aAxis.add(cradle);
        const cMotor = createStepper(34, 34, 10); cMotor.position.z = -44; aAxis.add(cMotor);

        const cAxis = new THREE.Group(); cAxis.position.z = -8; aAxis.add(cAxis);
        const platter = createMesh(new THREE.CylinderGeometry(40, 40, 8, 48), matTeal); platter.rotation.x = Math.PI/2; cAxis.add(platter);

        // --- WORKPIECE & LOGIC ---
        const workpiece = new VoxelWorkpiece(cAxis, {x: 35, y: 35, z: 25}, 30, matWorkpiece);
        let lastToolPos = new THREE.Vector3();

        function updateMachineStatus(payload) {
            const m = payload.mPos;
            zAxis.position.z = 200 + m[2];
            xAxis.position.x = -m[0];
            yAxis.position.y = -m[1];
            aAxis.rotation.x = m[3] * Math.PI / 180;
            cAxis.rotation.z = m[4] * Math.PI / 180;

            if (payload.activeIndex > 0) {
                const currentPos = new THREE.Vector3(); toolBit.getWorldPosition(currentPos);
                currentPos.z -= 11; // Pointe de l'outil
                workpiece.cut(currentPos, 3);
            }
        }

        // UI Handlers
        document.getElementById('reset-btn').onclick = () => workpiece.reset();
        document.getElementById('mode-btn').onclick = () => {
            const m = machineGroup.visible; machineGroup.visible = !m;
            document.getElementById('mode-text').innerText = m ? 'Outil' : 'Machine';
        };

        window.handleMessage = (data) => {
            if (data.type === 'update_machine') updateMachineStatus(data.payload);
            else if (data.type === 'set_theme') scene.background = new THREE.Color(data.payload.isDark ? '#050505' : '#f0f0f0');
        };

        window.addEventListener('message', (e) => handleMessage(e.data));
        if (window.ForgeronChannel) window.ForgeronChannel.postMessage(JSON.stringify({ type: 'viewer_ready' }));

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
