board: None
name: Forgeron CNC 5-Axes Trunnion (X,Y,Z,A,C) — ESP32 DevKit V1 + TB6600
meta: PFE ENI — Configuration production pour 5 drivers TB6600

# =============================================================================
# MOTEUR PAS A PAS : TB6600
# Câblage : PUL+ → GPIO, PUL- → GND | DIR+ → GPIO, DIR- → GND
# ENA partagé : ENA+ → GPIO22, ENA- → GND (HIGH = désactivé, LOW = activé)
# NOTE : Ajouter une résistance de 1kΩ en série sur PUL et DIR recommandée
# =============================================================================

stepping:
  # Moteur RMT ESP32 : précision maximale des impulsions
  engine: RMT
  # Délai avant désactivation des moteurs (255 = jamais)
  idle_ms: 255
  # Largeur d'impulsion STEP en µs (TB6600 : min 2µs)
  pulse_us: 4
  # Délai DIR avant STEP en µs
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12

spi:
  miso_pin: NO_PIN
  mosi_pin: NO_PIN
  sck_pin: NO_PIN

sdcard:
  cs_pin: NO_PIN
  card_detect_pin: NO_PIN
  frequency_hz: 8000000

kinematics:
  Cartesian:

axes:
  # GPIO22 partagé pour activer/désactiver TOUS les drivers en même temps
  shared_stepper_disable_pin: gpio.22

  shared_stepper_reset_pin: NO_PIN
  homing_runs: 2

  # ─────────────────────────────────────────────
  # AXE X — Linéaire horizontal
  # STEP → GPIO26 (D26) | DIR → GPIO27 (D27)
  # ─────────────────────────────────────────────
  x:
    # T8 (8mm/tour) + 1/16 micro : 200×16/8=400
    steps_per_mm: 400.000
    max_rate_mm_per_min: 1000.000
    acceleration_mm_per_sec2: 50.000
    # Adapter à la course réelle de ton axe X
    max_travel_mm: 200.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.26
        direction_pin: gpio.27

  # ─────────────────────────────────────────────
  # AXE Y — Linéaire frontal
  # STEP → GPIO25 (D25) | DIR → GPIO33 (D33)
  # ─────────────────────────────────────────────
  y:
    steps_per_mm: 400.000
    max_rate_mm_per_min: 1000.000
    acceleration_mm_per_sec2: 50.000
    max_travel_mm: 200.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.25
        direction_pin: gpio.33

  # ─────────────────────────────────────────────
  # AXE Z — Linéaire vertical (broche)
  # STEP → GPIO32 (D32) | DIR → GPIO23 (D23)
  # ─────────────────────────────────────────────
  z:
    steps_per_mm: 400.000
    # Z plus lent pour la sécurité
    max_rate_mm_per_min: 800.000
    acceleration_mm_per_sec2: 30.000
    max_travel_mm: 150.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.32
        direction_pin: gpio.23

  # ─────────────────────────────────────────────
  # AXE A — Rotatif TILT broche (trunnion)
  # STEP → GPIO19 (D19) | DIR → GPIO18 (D18)
  # steps_per_mm = en réalité steps_per_DEGREE ici
  # ─────────────────────────────────────────────
  a:
    # 200 pas × 1/16 micro × rapport réduc 5:1 / 360°
    steps_per_mm: 44.444
    max_rate_mm_per_min: 3600.000
    acceleration_mm_per_sec2: 50.000
    max_travel_mm: 720.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.19
        direction_pin: gpio.18

  # ─────────────────────────────────────────────
  # AXE C — Rotatif ROTATION plateau
  # STEP → GPIO17 (TX2) | DIR → GPIO16 (RX2)
  # ─────────────────────────────────────────────
  c:
    steps_per_mm: 44.444
    max_rate_mm_per_min: 3600.000
    acceleration_mm_per_sec2: 50.000
    max_travel_mm: 720.000
    soft_limits: false
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      stepstick:
        step_pin: gpio.17
        direction_pin: gpio.16

control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN

coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0

probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: true
  hard_stop: false

macros:
  startup_line0:
  startup_line1:
  Macro0:
  Macro1:
  Macro2:
  Macro3:
  after_homing:
  after_reset:
  after_unlock:

start:
  must_home: false
  deactivate_parking: false
  check_limits: true

parking:
  enable: false
  axis: Z
  target_mpos_mm: -5.000
  rate_mm_per_min: 800.000
  pullout_distance_mm: 5.000
  pullout_rate_mm_per_min: 250.000

user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

user_inputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

arc_tolerance_mm: 0.002
junction_deviation_mm: 0.010
verbose_errors: true
report_inches: false
enable_parking_override_control: false
use_line_numbers: false
planner_blocks: 16
