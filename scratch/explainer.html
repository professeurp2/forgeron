<title>Talk to the Machine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage, illustration above caption, controls beneath — built to be
   screen-recorded as a video and to loop unattended on a tablet at an exhibition stand. */
:root{
  --ground:#14171c;      /* workshop dark */
  --panel:#1b2027;
  --forge:#ff6a1a;       /* hot metal */
  --ink:#f4f1ea;
  --mute:#8d96a3;
  --steel:#39424e;
  --display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px;gap:14px;
}

/* ---------- masthead ---------- */
.mast{width:100%;max-width:980px;display:flex;align-items:baseline;gap:12px;
      border-bottom:1px solid var(--steel);padding-bottom:8px}
.word{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,30px);
      letter-spacing:.06em;text-transform:uppercase}
.word b{color:var(--forge);font-weight:700}
.where{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.08em;
       text-transform:uppercase;margin-left:auto;text-align:right;line-height:1.5}

/* ---------- stage ---------- */
.stage{width:100%;max-width:980px;aspect-ratio:16/9;max-height:62vh;position:relative;
       background:var(--panel);border:1px solid var(--steel);border-radius:6px;overflow:hidden}
.scene{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;
       opacity:0;transition:opacity .5s ease;pointer-events:none}
.scene.on{opacity:1}
.art{display:grid;place-items:center;min-height:0;padding:16px 16px 4px}
.art svg{width:100%;height:100%;max-height:100%;max-width:520px}
.cap{padding:0 clamp(16px,4vw,40px) clamp(14px,3vw,26px);text-align:center}
.step{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--forge);
      text-transform:uppercase;display:block;margin-bottom:6px}
.line{font-family:var(--display);font-weight:600;letter-spacing:.01em;
      font-size:clamp(17px,3.1vw,30px);line-height:1.18;margin:0;text-wrap:balance}
.line em{color:var(--forge);font-style:normal}
.sub{font-size:clamp(11px,1.5vw,14px);color:var(--mute);margin:8px auto 0;max-width:52ch;
     line-height:1.5}

/* ---------- progress ---------- */
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--steel)}
.fill{height:100%;width:0;background:var(--forge)}

/* ---------- controls ---------- */
.ctl{width:100%;max-width:980px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
       background:transparent;color:var(--mute);border:1px solid var(--steel);
       border-radius:4px;padding:7px 11px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--forge);outline-offset:2px}
button[aria-pressed="true"]{background:var(--forge);border-color:var(--forge);color:#160d06}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--steel);border:0;padding:0}
.dot[aria-current="true"]{background:var(--forge)}
.hint{font-family:var(--mono);font-size:10px;color:var(--steel);letter-spacing:.06em;
      width:100%;max-width:980px;text-align:center}

@media (prefers-reduced-motion:reduce){.scene{transition:none}.fill{transition:none}}
@media (max-width:620px){
  .where{display:none}
  .stage{aspect-ratio:4/5;max-height:none}
  .dots{margin-left:0;width:100%;justify-content:center;order:3}
}
</style>

<header class="mast">
  <span class="word">FOR<b>GERON</b></span>
  <span class="where">Bamako, Mali<br>UniPod Mali — ENI-ABT</span>
</header>

<div class="stage" id="stage" aria-live="polite"></div>

<div class="ctl">
  <button id="play" aria-pressed="true">Pause</button>
  <button id="prev">&larr;</button>
  <button id="next">&rarr;</button>
  <button id="lang">English</button>
  <button id="full">Plein écran</button>
  <div class="dots" id="dots"></div>
</div>
<p class="hint" id="hint">Espace : pause &middot; Flèches : naviguer &middot; L : langue</p>

    <rect x="283" y="60" width="32" height="44" rx="2" fill="#14171c"/>
    <circle cx="299" cy="112" r="3" fill="#8d96a3"/>

  /* 6 — it asks before moving */
  ask:`<svg viewBox="0 0 340 200" role="img" aria-label="The machine asks for confirmation before moving">
    <rect x="52" y="40" width="236" height="120" rx="7" fill="#1b2027" stroke="#8d96a3" stroke-width="2"/>

    <text x="170" y="166" text-anchor="middle" fill="#8d96a3" font-family="'IBM Plex Mono',monospace" font-size="9">IMPELLER</text>
    <text x="278" y="166" text-anchor="middle" fill="#8d96a3" font-family="'IBM Plex Mono',monospace" font-size="9">MOULD</text>
  </svg>`,
  /* 8 — medical */
  medical:`<svg viewBox="0 0 340 200" role="img" aria-label="A bone plate shaped for one person">

      <circle cx="126" cy="70" r="3.4"/><circle cx="122" cy="94" r="3.4"/>

    <text x="236" y="84" text-anchor="middle" fill="#f4f1ea" font-family="'Saira Condensed',sans-serif" font-size="23" font-weight="700">BONE PLATE</text>
    <text x="236" y="106" text-anchor="middle" fill="#8d96a3" font-family="'Saira Condensed',sans-serif" font-size="19" font-weight="600">DENTAL PROSTHESIS</text>
    <text x="236" y="128" text-anchor="middle" fill="#8d96a3" font-family="'Saira Condensed',sans-serif" font-size="19" font-weight="600">CUSTOM IMPLANT</text>
    <text x="236" y="152" text-anchor="middle" fill="#ff6a1a" font-family="'IBM Plex Mono',monospace" font-size="10">SHAPED TO ONE BODY</text>
  </svg>`,
  /* 9 — made here */
  africa:`<svg viewBox="0 0 340 200" role="img" aria-label="The continent of Africa, cut on the machine">
    <path d="M150 18 L186 20 L204 30 L214 26 L222 36 L238 40 L242 56 L232 72 L226 94

    <path d="M150 18 L186 20 L204 30 L214 26 L222 36 L238 40 L242 56 L232 72 L226 94
             L214 112 L208 134 L196 150 L188 170 L176 182 L166 176 L162 158 L152 146

      <animate attributeName="stroke-dashoffset" from="620" to="0" dur="4s" fill="freeze"/>
    </path>
    <circle cx="112" cy="68" r="4.5" fill="#ff6a1a"/>
    <text x="112" y="56" text-anchor="middle" fill="#f4f1ea" font-family="'IBM Plex Mono',monospace" font-size="9">MALI</text>
  </svg>`
};

const SCENES = [
  {art:'part', n:['01','01'],
   fr:['Un client apporte une pièce. L’atelier ne peut pas la faire.',
       'Une forme courbe, précise. La commande part ailleurs.'],
   en:['A customer brings in a part. The workshop cannot make it.',
       'A curved, precise shape. The order goes elsewhere.']},
  {art:'cost', n:['02','02'],
   fr:['La machine coûte <em>40 000 $</em>. Et il faut un spécialiste pour la piloter.',
       'Au Mali, ces spécialistes sont rares et chers.'],
   en:['The machine costs <em>$40,000</em>. And you need a specialist to run it.',
       'In Mali, those specialists are rare and expensive.']},
  {art:'import', n:['03','03'],
   fr:['Alors on importe la pièce.',
       'Trois semaines d’attente. Trois fois le prix. Et l’argent quitte le pays.'],
   en:['So the part is imported.',
       'Three weeks of waiting. Three times the price. And the money leaves the country.']},
  {art:'machine', n:['04','04'],
   fr:['Nous avons construit cette machine <em>à Bamako</em>.',
       'Cinq axes, pour les formes que les machines simples ne savent pas faire.'],
   en:['We built that machine <em>in Bamako</em>.',
       'Five axes — for the shapes a simple machine cannot cut.']},
  {art:'talk', n:['05','05'],
   fr:['On ne la programme pas. <em>On lui parle.</em>',
       'Vous dites ce que vous voulez, dans vos mots. Une IA s’occupe du reste.'],
   en:['You don’t program it. <em>You talk to it.</em>',
       'You say what you want, in your own words. An AI works out the rest.']},
  {art:'ask', n:['06','06'],
   fr:['Elle annonce ce qu’elle va faire, et <em>attend votre accord</em>.',
       'Avant chaque mouvement, elle simule le trajet. Si c’est dangereux, elle refuse.'],
   en:['It says what it is about to do, and <em>waits for your yes</em>.',
       'Before every move it simulates the path. If it is unsafe, it refuses.']},
  {art:'parts', n:['07','07'],
   fr:['Une pièce de rechange. Une turbine de pompe. Un moule.',
       'Le travail que l’atelier refusait hier.'],
   en:['A spare part. A pump impeller. A mould.',
       'The work the workshop used to turn away.']},
  {art:'medical', n:['08','08'],
   fr:['Et en médecine : une <em>plaque osseuse</em>, une prothèse dentaire, un implant sur mesure.',
       'Ces pièces épousent un seul corps. Aujourd’hui, elles sont importées.'],
   en:['And in medicine: a <em>bone plate</em>, a dental prosthesis, a custom implant.',
       'These parts fit one body only. Today, they are imported.']},
  {art:'africa', n:['09','09'],
   fr:['Fabriqué ici. <em>Pas importé.</em>',
       'Forgeron — Bamako, Mali.'],
   en:['Made here. <em>Not imported.</em>',
       'Forgeron — Bamako, Mali.']}
];

const DUR = 7000;
const stage = document.getElementById('stage');
const dots  = document.getElementById('dots');
let lang = 'fr', i = 0, playing = true, t0 = 0, raf = null;

SCENES.forEach((s, k) => {
  const el = document.createElement('div');
  el.className = 'scene';
  el.innerHTML = `<div class="art">${ART[s.art]}</div>
    <div class="cap"><span class="step"></span><p class="line"></p><p class="sub"></p></div>`;
  stage.appendChild(el);
  const d = document.createElement('button');
  d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', 'Scene ' + (k + 1));
  d.addEventListener('click', () => go(k));
  dots.appendChild(d);
});
const bar = document.createElement('div');
bar.className = 'bar'; bar.innerHTML = '<div class="fill" id="fill"></div>';
stage.appendChild(bar);
const fill = document.getElementById('fill');
const scenes = [...stage.querySelectorAll('.scene')];

function paint(){
  scenes.forEach((el, k) => {
    const s = SCENES[k];
    el.classList.toggle('on', k === i);
    el.querySelector('.step').textContent = s.n[0] + ' / 09';
    el.querySelector('.line').innerHTML = s[lang][0];
    el.querySelector('.sub').textContent = s[lang][1];
  });
  [...dots.children].forEach((d, k) => d.setAttribute('aria-current', k === i));
}
function go(k){ i = (k + SCENES.length) % SCENES.length; t0 = performance.now(); paint(); }
function tick(now){
  if(playing){
    const p = (now - t0) / DUR;
    fill.style.width = Math.min(p, 1) * 100 + '%';
    if(p >= 1) go(i + 1);
  }
  raf = requestAnimationFrame(tick);
}
function setPlay(on){
  playing = on;
  const b = document.getElementById('play');
  b.textContent = on ? (lang === 'fr' ? 'Pause' : 'Pause') : (lang === 'fr' ? 'Lecture' : 'Play');
  b.setAttribute('aria-pressed', on);
  if(on) t0 = performance.now() - 0;
}

document.getElementById('play').addEventListener('click', () => setPlay(!playing));
document.getElementById('prev').addEventListener('click', () => go(i - 1));
document.getElementById('next').addEventListener('click', () => go(i + 1));
document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  document.getElementById('lang').textContent = lang === 'fr' ? 'English' : 'Français';
  document.getElementById('full').textContent = lang === 'fr' ? 'Plein écran' : 'Full screen';
  document.getElementById('hint').textContent = lang === 'fr'
    ? 'Espace : pause · Flèches : naviguer · L : langue'
    : 'Space: pause · Arrows: navigate · L: language';
  setPlay(playing); paint();
});
document.getElementById('full').addEventListener('click', () => {
  if(document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
addEventListener('keydown', e => {
  if(e.key === ' '){ e.preventDefault(); setPlay(!playing); }
  else if(e.key === 'ArrowRight') go(i + 1);
  else if(e.key === 'ArrowLeft') go(i - 1);
  else if(e.key.toLowerCase() === 'l') document.getElementById('lang').click();
});

paint(); t0 = performance.now(); raf = requestAnimationFrame(tick);
</script>
